# Baut die iPhone-App aus ios/ auf einem Mac von GitHub und legt sie als LEDControl.ipa ab.
# Die App ist unsigniert: AltStore oder Sideloadly signieren sie beim Installieren mit der eigenen Apple-ID.
#
# Auf main wird jede neue Version zusätzlich als GitHub-Release „ios-v1.1.<Lauf>“ veröffentlicht,
# samt AltStore-Quelle (altstore.json). Darüber bekommt AltStore die Updates, und die App selbst
# sieht beim Öffnen nach, ob es eine neuere Version gibt.
name: iOS-App bauen

on:
  workflow_dispatch:
  push:
    branches: ['**']        # nur Zweige; Tags (z. B. von Releases) starten keinen Build
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  schedule:
    # Monatlich neu bauen: TestFlight-Versionen laufen nach 90 Tagen ab
    - cron: '17 5 1 * *'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # Auf main nie eine laufende Veröffentlichung abbrechen
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VERSION: 1.1.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  build:
    name: LEDControl.ipa
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Logik gegen index.html prüfen
        working-directory: ios
        run: |
          xcrun swiftc -swift-version 5 -O \
            LEDControl/ColorMath.swift LEDControl/Flows.swift LEDControl/Command.swift \
            LEDControl/SendQueue.swift LEDControl/LightHub.swift LEDControl/LightController.swift \
            LEDControl/Scenes.swift LEDControl/SoundMeter.swift LEDControl/Updater.swift \
            Tests/main.swift -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check" Tests/expected.json

      - name: XcodeGen installieren
        if: ${{ !cancelled() }}        # auch bauen, wenn der Selbsttest scheitert (beide Fehler auf einmal sehen)
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        if: ${{ !cancelled() }}        # auch bauen, wenn der Selbsttest scheitert (beide Fehler auf einmal sehen)
        working-directory: ios
        run: xcodegen generate

      - name: App bauen (unsigniert)
        if: ${{ !cancelled() }}        # auch bauen, wenn der Selbsttest scheitert (beide Fehler auf einmal sehen)
        working-directory: ios
        run: |
          xcodebuild -project LEDControl.xcodeproj -scheme LEDControl -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -quiet build

      - name: App prüfen und als .ipa packen
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/LEDControl.app
          test -d "$APP"
          for key in CFBundleShortVersionString CFBundleVersion CFBundleIdentifier MinimumOSVersion UIDeviceFamily \
                     NSBluetoothAlwaysUsageDescription NSMicrophoneUsageDescription CFBundleURLTypes; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" | tr '\n' ' ')"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = "false"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Geist.ttf"
          test -f "$APP/GeistMono.ttf"
          ls "$APP" | grep -i -E "Metadata.appintents|\.car$" || true
          lipo -info "$APP/LEDControl"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LEDControl.ipa Payload
          ls -lh LEDControl.ipa

      - name: AltStore-Quelle probeweise erzeugen
        working-directory: ios
        run: |
          python3 scripts/make-source.py --ipa LEDControl.ipa --tag "ios-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/altstore.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d['apps'][0]['appPermissions'], ensure_ascii=False))" "$RUNNER_TEMP/altstore.json"

      - name: .ipa hochladen
        uses: actions/upload-artifact@v7
        with:
          name: LEDControl.ipa
          path: ios/LEDControl.ipa
          archive: false
          if-no-files-found: error
          retention-days: 90

  # Läuft bei jedem Build: holt die .ipa, erzeugt die AltStore-Quelle und packt alles für die Veröffentlichung.
  # So ist auch dieser Teil auf jedem Zweig geprüft, nicht erst auf main.
  prepare:
    name: Veröffentlichung vorbereiten
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: .ipa holen
        uses: actions/download-artifact@v8
        with:
          name: LEDControl.ipa
          path: dist

      - name: AltStore-Quelle erzeugen
        run: |
          ls -lR dist
          IPA=$(find dist -name '*.ipa' -type f | head -1)
          test -n "$IPA"
          mkdir -p release prev
          cp "$IPA" release/LEDControl.ipa
          cp ios/LEDControl/Assets.xcassets/AppIcon.appiconset/icon-1024.png release/icon.png
          gh release download --repo "$GITHUB_REPOSITORY" --pattern altstore.json --dir prev 2>/dev/null || echo "Noch keine frühere Quelle"
          NOTES=$(git log -1 --pretty=%s)
          python3 ios/scripts/make-source.py --ipa release/LEDControl.ipa --tag "ios-v$VERSION" --repo "$GITHUB_REPOSITORY"             --previous prev/altstore.json --notes "$NOTES" --out release/altstore.json
          {
            echo "LED Control $VERSION"
            echo
            echo "$NOTES"
            echo
            echo "**Installieren:** \`LEDControl.ipa\` mit AltStore oder Sideloadly aufs iPhone bringen (Anleitung: \`ios/README.md\`)."
            echo
            echo "**AltStore-Quelle für automatische Updates:**"
            echo "\`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/altstore.json\`"
          } > release/notes.md
          ls -l release
          cat release/notes.md

      - name: Dateien für die Veröffentlichung ablegen
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Nur auf main: GitHub-Release anlegen. Darüber holen sich AltStore und die App die Updates.
  release:
    name: Veröffentlichen
    needs: prepare
    # Der monatliche Lauf ist nur für TestFlight da, kein neues Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dateien holen
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Release anlegen
        working-directory: release
        run: |
          gh release create "ios-v$VERSION" LEDControl.ipa altstore.json icon.png             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "LED Control $VERSION" --notes-file notes.md --latest

  # TestFlight: nur wenn die vier Secrets angelegt sind (Anleitung in ios/README.md, „Weg 3“).
  # Secrets lassen sich in Bedingungen nicht direkt abfragen, deshalb dieser kleine Vorab-Schritt.
  testflight-check:
    name: TestFlight eingerichtet?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "TestFlight ist eingerichtet."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight noch nicht eingerichtet, es fehlen:$missing"
          fi

  # Signiert die App mit dem Apple-Entwickler-Account (Cloud-Signierung über den API-Schlüssel)
  # und lädt sie zu TestFlight hoch. Von dort installiert und aktualisiert die TestFlight-App sie.
  testflight:
    name: TestFlight
    needs: [build, testflight-check]
    if: needs.testflight-check.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$KEY")"
          # Akzeptiert den Inhalt der .p8-Datei direkt oder base64-kodiert
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 ist kein gültiger API-Schlüssel (.p8)"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      # Erst ohne Signatur bauen und nur beim Export signieren lassen: so legt Xcode nicht bei jedem
      # Lauf ein neues Entwickler-Zertifikat an.
      - name: Archiv bauen (ohne Signatur)
        working-directory: ios
        run: |
          xcodebuild -project LEDControl.xcodeproj -scheme LEDControl -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LEDControl.xcarchive" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -quiet archive

      - name: Signieren und zu TestFlight hochladen
        id: upload
        continue-on-error: true
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LEDControl.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Falls Apple das nachträgliche Signieren ablehnt: signiert bauen (legt dann ein Entwickler-Zertifikat an)
      - name: Zweiter Versuch mit signiertem Archiv
        if: steps.upload.outcome == 'failure'
        working-directory: ios
        run: |
          rm -rf "$RUNNER_TEMP/LEDControl.xcarchive" "$RUNNER_TEMP/export"
          xcodebuild -project LEDControl.xcodeproj -scheme LEDControl -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LEDControl.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LEDControl.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Hinweis
        run: |
          echo "Version $VERSION (Build $BUILD) ist bei Apple hochgeladen."
          echo "Apple verarbeitet sie noch etwa 10–30 Minuten, dann erscheint sie in der TestFlight-App."

      - name: API-Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # Bilder für den App Store (größtes iPhone), im Simulator im Vorführmodus aufgenommen
  screenshots:
    name: App-Store-Bilder
    needs: build
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Für den Simulator bauen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project LEDControl.xcodeproj -scheme LEDControl -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -quiet build

      - name: Simulator starten
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          found = []
          for runtime, items in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              for d in items:
                  n = re.search(r"iPhone (\d+) Pro Max", d["name"])
                  if n:
                      found.append(((int(m.group(1)), int(m.group(2))), int(n.group(1)), d["udid"], d["name"], runtime))
          found.sort()
          best = found[-1]
          print(best[2])
          print("Simulator:", best[3], best[4], file=sys.stderr)
          ')
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl ui "$SIM" appearance dark
          xcrun simctl status_bar "$SIM" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Bilder aufnehmen
        run: |
          APP=ios/build-sim/Build/Products/Release-iphonesimulator/LEDControl.app
          xcrun simctl install "$SIM" "$APP"
          mkdir -p shots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$SIM" de.feuerbrand.ledcontrol 2>/dev/null || true
            xcrun simctl launch "$SIM" de.feuerbrand.ledcontrol -demo YES "$@"
            sleep 8
            xcrun simctl io "$SIM" screenshot "shots/$name.png"
          }
          shoot 1-licht -screenshotTab light -screenshotFlow aurora
          shoot 2-effekte -screenshotTab effects -screenshotFlow sunset
          shoot 3-geraete -screenshotTab devices -screenshotColor FF7A00
          shoot 4-mehr -screenshotTab more -screenshotColor 00E5FF
          sips -g pixelWidth -g pixelHeight shots/*.png

      - name: Bilder hochladen
        uses: actions/upload-artifact@v7
        with:
          name: app-store-bilder
          path: shots/
          if-no-files-found: error
          retention-days: 90
