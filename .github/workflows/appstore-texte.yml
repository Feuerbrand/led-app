# Lädt nur Texte, Bilder und Prüfer-Infos zu App Store Connect hoch, ohne neu zu bauen.
# Bilder und Video kommen aus einem früheren Lauf von „iOS-App bauen“.
name: App-Store-Texte erneut hochladen

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Lauf-Nummer von „iOS-App bauen“, aus dem Bilder und Video stammen'
        required: true
      version:
        description: 'Version in App Store Connect, z. B. 1.1.26'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  hochladen:
    name: App-Store-Texte und Bilder hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Bilder holen
        uses: actions/download-artifact@v8
        with:
          name: app-store-bilder
          path: ios/fastlane/screenshots/de-DE
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Video holen
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: app-store-video
          path: ios/fastlane/video
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: fastlane installieren
        run: gem install fastlane --no-document

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/key.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/key.p8"
          fi
          python3 - "$RUNNER_TEMP/keys" <<'PY'
          import json, os, sys
          folder = sys.argv[1]
          key = open(os.path.join(folder, "key.p8")).read()
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": key, "in_house": False}, open(os.path.join(folder, "api.json"), "w"))
          PY
          echo "ASC_API_JSON=$RUNNER_TEMP/keys/api.json" >> "$GITHUB_ENV"

      - name: Hochladen
        working-directory: ios
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          VERSION: ${{ inputs.version }}
        run: |
          ls -l fastlane/screenshots/de-DE
          cp -r fastlane/screenshots/de-DE fastlane/screenshots/en-GB
          EXTRA=()
          if [ -f fastlane/video/tour.mov ]; then EXTRA=(--app_review_attachment_file fastlane/video/tour.mov); fi
          fastlane deliver "${EXTRA[@]}" \
            --api_key_path "$ASC_API_JSON" \
            --app_identifier de.feuerbrand.ledcontrol \
            --platform ios \
            --app_version "$VERSION" \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --overwrite_screenshots true \
            --skip_binary_upload true \
            --submit_for_review false \
            --run_precheck_before_submit false \
            --automatic_release true \
            --force true

      - name: API-Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
