# Beschreibung des Xcode-Projekts für XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Das eigentliche LEDControl.xcodeproj wird daraus erzeugt und liegt nicht im Repository:
#   xcodegen generate
name: LEDControl

options:
  bundleIdPrefix: de.feuerbrand
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LEDControl:
    type: application
    platform: iOS
    sources:
      - path: LEDControl
        excludes:
          - Info.plist                    # wird über INFOPLIST_FILE eingebunden, nicht als Ressource kopiert
      - path: Shared                      # Befehle für Kontrollzentrum und Widgets (auch in der Erweiterung)
    dependencies:
      - target: LEDWidgets                # Knöpfe für Kontrollzentrum, Sperrbildschirm und Home-Bildschirm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerbrand.ledcontrol
        PRODUCT_NAME: LEDControl
        INFOPLIST_FILE: LEDControl/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"       # nur iPhone

  # Widget-Erweiterung: Kontrollzentrum und Sperrbildschirm (ab iOS 18), Home-Bildschirm
  LEDWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LEDWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerbrand.ledcontrol.widgets
        PRODUCT_NAME: LEDWidgets
        INFOPLIST_FILE: LEDWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  # Tour durch die App fürs Vorführ-Video (läuft nur im Simulator, siehe Workflow)
  LEDControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LEDControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerbrand.ledcontrol.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LEDControl
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  LEDControl:
    build:
      targets:
        LEDControl: all
    test:
      config: Debug
      targets:
        - LEDControlUITests
    run:
      config: Debug
    archive:
      config: Release
